<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clean, secure and modern login portal with dynamic captcha and quick sign-up.">
  <title>Welcome Back | Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Background glow elements -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <main class="login-container">
      <div class="card">
        <!-- Header & Greeting -->
        <header class="card-header">
          <a href="../index.html" class="brand-badge" style="text-decoration: none; color: inherit;">
            <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path>
            </svg>
            <span>LivePartner Matrimony</span>
          </a>
          <h1 class="greeting-title" id="greetingTitle">Welcome back! <span class="wave">👋</span></h1>
          <p class="greeting-subtitle">Please enter your credentials to access your matrimony account.</p>
        </header>

        <!-- Notification Toast -->
        <div id="toast" class="toast" role="alert" aria-live="polite" hidden>
          <span class="toast-icon" id="toastIcon"></span>
          <span class="toast-message" id="toastMessage"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="auth-form" novalidate>
          <!-- Username / Email Field -->
          <div class="form-group">
            <label for="username" class="form-label">Username or Email</label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
              </span>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-input" 
                placeholder="e.g. alex@example.com" 
                autocomplete="username"
                required
              >
            </div>
            <span class="error-text" id="usernameError"></span>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <div class="label-row">
              <label for="password" class="form-label">Password</label>
            </div>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-input" 
                placeholder="••••••••••••" 
                autocomplete="current-password"
                required
              >
              <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
            <span class="error-text" id="passwordError"></span>
          </div>

          <!-- Captcha Field -->
          <div class="form-group">
            <label for="captchaInput" class="form-label">Security Verification</label>
            <div class="captcha-row">
              <div class="input-wrapper captcha-input-wrap">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  </svg>
                </span>
                <input 
                  type="text" 
                  id="captchaInput" 
                  name="captcha" 
                  class="form-input captcha-input" 
                  placeholder="Enter code" 
                  maxlength="6"
                  autocomplete="off"
                  required
                >
              </div>

              <!-- Dynamic Captcha Display -->
              <div class="captcha-display-box" title="Click reload to refresh captcha">
                <canvas id="captchaCanvas" width="130" height="42" class="captcha-canvas"></canvas>
                <button type="button" id="refreshCaptcha" class="btn-refresh-captcha" aria-label="Refresh captcha code" title="Generate new code">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <polyline points="1 20 1 14 7 14"></polyline>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                  </svg>
                </button>
              </div>
            </div>
            <span class="error-text" id="captchaError"></span>
          </div>

          <!-- Forgot Password Link & Remember Me -->
          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span class="custom-checkbox"></span>
              <span class="checkbox-label">Remember me</span>
            </label>
            <a href="#forgot-password" id="forgotPasswordLink" class="link-forgot">Forgot Password?</a>
          </div>

          <!-- Login Button -->
          <button type="submit" id="loginBtn" class="btn-primary">
            <span class="btn-text">Sign In</span>
            <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <!-- Divider -->
        <div class="divider">
          <span>or sign up for an account</span>
        </div>

        <!-- New Users Sign Up Section -->
        <section class="signup-section" aria-labelledby="signupTitle">
          <div class="signup-header">
            <h2 id="signupTitle" class="signup-title">New around here?</h2>
            <p class="signup-subtitle">Enter your email to request an invitation or create a new profile.</p>
          </div>

          <form id="signupForm" class="signup-form" novalidate>
            <div class="signup-input-group">
              <div class="input-wrapper signup-input-wrapper">
                <span class="input-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </span>
                <input 
                  type="email" 
                  id="signupEmail" 
                  name="signupEmail" 
                  class="form-input" 
                  placeholder="name@company.com" 
                  required
                >
              </div>
              <button type="submit" id="signupBtn" class="btn-secondary">
                <span>Sign Up</span>
              </button>
            </div>
            <span class="error-text" id="signupEmailError"></span>
          </form>
        </section>

        <!-- Card Footer -->
        <footer class="card-footer">
          <p>© 2026 Nexus Auth Inc. · <a href="#privacy" class="footer-link">Privacy</a> · <a href="#terms" class="footer-link">Terms</a></p>
        </footer>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
